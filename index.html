<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حساباتي الشخصية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7686;--pri:#0f766e;--inc:#15803d;--exp:#b91c1c;--bd:#e3e7ec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1419;--card:#18202a;--tx:#e8edf2;--mut:#93a0b0;--pri:#2dd4bf;--inc:#4ade80;--exp:#f87171;--bd:#2a3542;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1419;--card:#18202a;--tx:#e8edf2;--mut:#93a0b0;--pri:#2dd4bf;--inc:#4ade80;--exp:#f87171;--bd:#2a3542;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',system-ui,Tahoma,sans-serif;font-size:15px}
#w{max-width:760px;margin:auto;padding:12px}
h1{font-size:20px;margin:6px 0 10px;color:var(--pri)}h3{margin:0 0 8px;font-size:16px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}.k small{color:var(--mut);display:block}.k b{font-size:18px}
.inc{color:var(--inc)}.exp{color:var(--exp)}.mut{color:var(--mut)}
input,select,button.b{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;width:100%}
button.b{background:var(--pri);color:#fff;border:0;cursor:pointer;font-weight:700}button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.x{background:none;border:0;color:var(--exp);cursor:pointer;font:inherit}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f .w{grid-column:1/-1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--pri)}
.bars{display:flex;gap:8px;height:120px;align-items:flex-end}.bc{flex:1;text-align:center}.bp{height:100px;display:flex;gap:3px;align-items:flex-end}.bp i{flex:1;border-radius:4px 4px 0 0;min-height:2px}
.mp{margin-bottom:10px}textarea{width:100%;min-height:90px;font:12px monospace;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px}
#toast{z-index:60;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;transition:.2s;pointer-events:none}

.logo{display:block;height:64px;width:auto}
.sch{display:flex;align-items:center;gap:12px;border-color:var(--pri)}
.sch b{font-size:17px;color:var(--pri)}
.sm{padding:6px 10px;border-radius:10px;border:0;font:inherit;font-size:13px;cursor:pointer;color:#fff}
.wa{background:#16a34a}.sms{background:#2563eb}
table.st{width:100%;border-collapse:collapse;font-size:13px}table.st th,table.st td{border:1px solid var(--bd);padding:6px;text-align:center}table.st th{background:var(--bg)}
details summary{cursor:pointer;font-weight:700}
@media print{#nav,#td,h1,.noprint,#toast{display:none!important}body{background:#fff;color:#000}:root{--bg:#fff;--card:#fff;--tx:#000}}

.hide-amt .amt{filter:blur(7px);user-select:none}
#lk{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.lkc{width:100%;max-width:340px;text-align:center}
.dots{display:flex;gap:12px;justify-content:center;margin:14px 0 6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri);display:block}.dots i.on{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.pad button{font:inherit;font-size:22px;padding:14px 0;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.mdl{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);overflow:auto;display:flex;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.mdl>div{max-width:520px;width:100%;margin:auto;background:var(--card);border-radius:14px;padding:14px}
.dcp{display:block;margin-top:2px}
#toast{z-index:200}
#prt{display:none}
@media print{.hide-amt .amt{filter:none}body.prt>*:not(#prt){display:none!important}body.prt #prt{display:block!important;max-width:100%;margin:auto}}
</style></head><body><div id="w"><h1>💰 حساباتي الشخصية</h1><div id="td" class="mut" style="margin-bottom:8px"></div><div id="qb" class="noprint" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"></div><nav id="nav"></nav><div id="app"></div></div><div id="toast"></div><img id="prt" alt="">

function h53(s,seed){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function pinH(p,salt){let x=salt+'|'+p;for(let i=0;i<2000;i++)x=h53(x+salt,i&15);return x}
